<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Great King Academy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

  <header class="p-4 bg-slate-800/80 border-b border-slate-700 flex justify-between items-center">
    <h1 class="text-lg font-bold text-amber-400">Great King Academy</h1>
    <a href="#apply" class="text-sm bg-amber-500 text-slate-950 font-semibold px-3 py-1.5 rounded-md">Apply Now</a>
  </header>

  <main class="p-6 max-w-md mx-auto w-full flex-grow">
    <h2 class="text-2xl font-bold mb-2">Student Application</h2>
    <p class="text-slate-400 text-sm mb-6">Fill in the details below to register.</p>

    <form id="admissionForm" class="space-y-4 bg-slate-800 p-5 rounded-xl border border-slate-700">
      <div>
        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Student Full Name</label>
        <input type="text" id="student_name" required class="w-full p-3 bg-slate-900 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400" placeholder="John Doe">
      </div>
      <div>
        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Class Applying For</label>
        <input type="text" id="class_applying" required class="w-full p-3 bg-slate-900 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400" placeholder="e.g. Grade 10">
      </div>
      <div>
        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Parent Contact Number</label>
        <input type="tel" id="phone" required class="w-full p-3 bg-slate-900 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400" placeholder="+231 ...">
      </div>

      <button type="submit" class="w-full py-3 bg-amber-500 font-bold text-slate-950 rounded-lg active:scale-95 transition">Submit Application</button>
    </form>

    <p id="responseMsg" class="mt-4 text-center font-medium text-sm"></p>
  </main>

  <script src="js/supabase.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
