name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Change to "master" if your primary branch is named master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.dpbvwmpvdmoihjweknlt }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRwYnZ3bXB2ZG1vaWhqd2Vrbmx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5MDkwNjksImV4cCI6MjEwMzQ4NTA2OX0.nPAjPGVHrv_2TL-8d2iq1xhLXyIlI-MlU2bhTJkUt_A }}

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
